<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sociogram viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0e13; font: 13px/1.4 system-ui, sans-serif; color: #c9d1d9; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 12px; top: 12px; padding: 10px 12px; background: rgba(13,17,23,.85); border: 1px solid #30363d; border-radius: 8px; max-width: 320px; }
  #hud h1 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  #hud .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  button, select { background: #21262d; color: inherit; border: 1px solid #30363d; border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button:hover { background: #30363d; }
  #stats { margin-top: 6px; color: #8b949e; font-variant-numeric: tabular-nums; }
  #msg { margin-top: 6px; color: #ff7b72; }
  a { color: #58a6ff; }
</style>
<canvas id="c"></canvas>
<div id="hud">
  <h1>Sociogram viewer</h1>
  <div id="stats">starting…</div>
  <div class="row">
    <label>Nodes
      <select id="size">
        <option value="400">400</option><option value="2000">2,000</option><option value="10000">10,000</option>
        <option value="50000">50,000</option><option value="100000">100,000</option>
      </select>
    </label>
    <label>Long links
      <select id="fade"><option value="auto">auto</option><option value="off">all</option><option value="short">short only</option></select>
    </label>
  </div>
  <div class="row">
    <button id="fit">Fit</button><button id="reheat">Reheat</button><button id="shot">Screenshot</button>
  </div>
  <div id="msg"></div>
  <div style="margin-top:8px;color:#8b949e">Drag to pan, wheel to zoom, hover/click nodes.</div>
</div>
<script type="module">
import { SociogramView } from "/packages/sociogram/dist/index.js";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
$("size").value = params.get("n") ?? "2000";

const palette = [[0.96,0.45,0.45],[0.45,0.8,0.55],[0.45,0.6,0.97],[0.97,0.8,0.4],[0.75,0.55,0.95],[0.4,0.85,0.85],[0.95,0.6,0.8],[0.7,0.7,0.7]];
function communityGraph(n) {
  let seed = 12345;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const per = Math.max(20, Math.min(400, Math.round(Math.sqrt(n) * 1.2)));
  const groups = Math.ceil(n / per);
  const list = [];
  for (let i = 0; i < n; i++) {
    const g = Math.floor(i / per), lo = g * per, hi = Math.min(n, lo + per);
    for (let k = 0; k < 3; k++) list.push(i, lo + Math.floor(rnd() * (hi - lo)));
  }
  for (let k = 0; k < Math.max(30, n / 20); k++) list.push(Math.floor(rnd() * n), Math.floor(rnd() * n));
  const colors = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) colors.set([...palette[Math.floor(i / per) % palette.length], 1], i * 4);
  return { nodeCount: n, edges: new Uint32Array(list), colors, groups };
}

let view;
async function start() {
  try {
    view = await SociogramView.create($("c"));
  } catch (e) {
    $("stats").textContent = "";
    $("msg").textContent = e.name === "WebGpuUnsupportedError" ? "This browser cannot run WebGPU (try a current Chrome or Edge)." : String(e.message || e);
    return;
  }
  view.on("nodeHover", (i) => { $("stats").dataset.hover = i ?? ""; });
  view.on("nodeClick", (i) => { $("msg").style.color = "#58a6ff"; $("msg").textContent = `clicked node ${i}`; });
  view.on("error", (e) => { $("msg").style.color = "#ff7b72"; $("msg").textContent = e.message; });
  load(Number($("size").value));
  let frames = 0, last = performance.now();
  const tick = (now) => {
    frames++;
    if (now - last >= 500) {
      const fps = Math.round((frames * 1000) / (now - last)); frames = 0; last = now;
      if (!view.destroyed) $("stats").textContent = `${nodes.toLocaleString()} nodes · ${links.toLocaleString()} links · ${fps} fps${$("stats").dataset.hover ? " · hover " + $("stats").dataset.hover : ""}`;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
let nodes = 0, links = 0;
function load(n) {
  const g = communityGraph(n);
  nodes = g.nodeCount; links = g.edges.length / 2;
  $("msg").textContent = "";
  view.setData({ nodeCount: g.nodeCount, edges: g.edges, colors: g.colors });
  applyFade();
}
function applyFade() {
  const v = $("fade").value;
  if (v === "auto") view.setLinkFade("auto");
  else if (v === "off") view.setLinkFade("off");
  else view.setLinkFade({ startPx: 60, endPx: 200 });
}
$("size").addEventListener("change", () => view && load(Number($("size").value)));
$("fade").addEventListener("change", () => view && applyFade());
$("fit").addEventListener("click", () => view?.fitView());
$("reheat").addEventListener("click", () => view?.reheat());
$("shot").addEventListener("click", async () => {
  try {
    const blob = await view.screenshot();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "sociogram.png"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) { $("msg").style.color = "#ff7b72"; $("msg").textContent = e.message; }
});
start();
</script>
