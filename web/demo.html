<!doctype html>
<meta charset="utf-8">
<title>sociogram demo</title>
<style>html,body{margin:0;background:#000}#c{width:480px;height:360px;display:block;touch-action:none}</style>
<canvas id="c"></canvas>
<script type="module">
import { SociogramView } from "/packages/sociogram/dist/index.js";
window.__events = [];
try {
  const canvas = document.getElementById("c");
  const view = await SociogramView.create(canvas);
  let seed = 12345;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const groups = 5, per = 80, n = groups * per, list = [];
  for (let i = 0; i < n; i++) { const b = Math.floor(i / per) * per; for (let k = 0; k < 3; k++) list.push(i, b + Math.floor(rnd() * per)); }
  for (let k = 0; k < 30; k++) list.push(Math.floor(rnd() * n), Math.floor(rnd() * n));
  const palette = [[0.96,0.45,0.45],[0.45,0.8,0.55],[0.45,0.6,0.97],[0.97,0.8,0.4],[0.75,0.55,0.95]];
  const colors = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) colors.set([...palette[Math.floor(i / per)], 1], i * 4);
  view.setData({ nodeCount: n, edges: new Uint32Array(list), colors });
  view.on("nodeHover", (i) => window.__events.push(["hover", i]));
  view.on("nodeClick", (i) => window.__events.push(["click", i]));
  view.on("error", (e) => window.__events.push(["error", e.message]));
  window.__view = view;
  window.__ready = true;
} catch (e) {
  window.__error = `${e.name}: ${e.message}`;
}
</script>
