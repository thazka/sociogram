name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match the `wasm-bindgen` version pinned in crates/sociogram-web/Cargo.toml.
  WASM_BINDGEN_VERSION: 0.2.130

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (native)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (wasm32)
        run: cargo clippy -p sociogram-web --target wasm32-unknown-unknown -- -D warnings
      # Free runners have no GPU, so the GPU tests skip themselves here (they
      # also skip on software adapters). Run `node scripts/verify.mjs` on a
      # machine with a real GPU before pushing: it requires the GPU tests.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo test --workspace -- --nocapture 2>&1 | tee test.log || status=$?
          skipped=$(grep -c "skipping GPU test" test.log || true)
          echo "::notice title=GPU tests::${skipped} GPU test(s) skipped on this runner (no real GPU). They are verified locally with scripts/verify.mjs."
          if [ "$status" != 0 ]; then
            grep -E -A3 "panicked at" test.log | head -40 | while read -r line; do echo "::error::${line}"; done
            tail -20 test.log | while read -r line; do echo "::error title=end of test log::${line}"; done
          fi
          exit "$status"

  gpu-software:
    name: GPU tests on a software Vulkan driver (informational)
    runs-on: ubuntu-latest
    # Pixel assertions were written against real GPUs and a software rasterizer
    # may differ slightly, so this job never blocks a merge. It shows how much of
    # the GPU test suite also passes without a GPU.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install a software Vulkan driver (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Tests
        shell: bash
        env:
          WGPU_BACKEND: vulkan
          SOCIOGRAM_SOFTWARE_GPU: "1"
        run: |
          set -o pipefail
          status=0
          # One thread: the software driver has segfaulted before, and with the
          # tests in sequence the last test name in the log is the one that did it.
          cargo test --workspace -- --nocapture --test-threads=1 2>&1 | tee test.log || status=$?
          if [ "$status" != 0 ]; then
            grep -E -A3 "panicked at" test.log | head -40 | while read -r line; do echo "::warning::${line}"; done
            tail -20 test.log | while read -r line; do echo "::warning title=end of test log::${line}"; done
          fi
          exit "$status"

  package:
    name: npm package (wasm build and TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        id: bindgen-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}
      - name: Install wasm-bindgen-cli
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/sociogram/package-lock.json
      - name: Build
        working-directory: packages/sociogram
        run: |
          npm ci
          npm run build
      - name: Type check and unit tests (lifecycle, server rendering, public types)
        working-directory: packages/sociogram
        run: |
          npm run typecheck
          npm test
      # Builds every example app against the packed package, the way a user's
      # project would consume it. It needs no GPU. The browser checks do, and run
      # locally (web/verify-example.mjs without --build-only).
      # Informational until it has been green on GitHub once: it could not be run
      # on a GitHub runner when it was written.
      - name: Build the example apps from the packed package
        continue-on-error: true
        timeout-minutes: 40
        run: |
          (cd web && npm ci)
          for example in react-vite vue-vite next nuxt angular element-vite; do
            node web/verify-example.mjs "$example" --build-only
          done
